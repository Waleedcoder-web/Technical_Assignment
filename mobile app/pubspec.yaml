name: havenkey_mobile
description: "HavenKey - Next-Gen Real Estate & Sovereign Property Platform Mobile App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  http: ^1.2.2
  provider: ^6.1.2
  intl: ^0.19.0
  supabase_flutter: ^2.18.3
  mailer: ^7.3.0
  image_picker: ^1.2.4
  bcrypt: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
